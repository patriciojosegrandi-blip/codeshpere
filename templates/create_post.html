<!DOCTYPE html>
<html>
<head>
    <title>Nuevo Post</title>

    <style>
        body {
            background: #f3f4f6;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 600px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            resize: none;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 10px;
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Crear publicación</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <textarea name="content" placeholder="¿Qué estás pensando?"></textarea>

    <br><br>

    <input type="file" name="image">

    <br><br>

    <button type="submit">Publicar</button>
</form>

</body>
</html>
