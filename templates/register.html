```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | CodeSphere</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f5f5f0;
            --surface: #ffffff;
            --text: #252820;
            --muted: #85877d;
            --border: #e8e9e1;
            --primary: #647c55;
            --primary-hover: #536a46;
            --soft: #f0f2eb;
            --input: #fafbf8;
            --shadow: 0 12px 35px rgba(40, 45, 30, 0.06);
        }

        body.dark {
            --bg: #171914;
            --surface: #22251e;
            --text: #f0f1e9;
            --muted: #a0a394;
            --border: #383c32;
            --primary: #91a97d;
            --primary-hover: #a5bd91;
            --soft: #30362a;
            --input: #292d24;
            --shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            transition: background .25s, color .25s;
        }

        nav {
            height: 75px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 25px;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
            letter-spacing: -1px;
        }

        .logo span {
            color: var(--primary);
        }

        .theme-button {
            border: 1px solid var(--border);
            background: var(--soft);
            color: var(--text);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 17px;
        }

        main {
            max-width: 1000px;
            margin: 65px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 55px;
            align-items: center;
        }

        .intro small {
            color: var(--primary);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .intro h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 43px;
            line-height: 1.15;
            letter-spacing: -2px;
            margin: 12px 0;
        }

        .intro h1 span {
            color: var(--primary);
        }

        .intro p {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.8;
            max-width: 390px;
        }

        .register-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            box-shadow: var(--shadow);
        }

        .register-card h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 25px;
            margin: 0 0 7px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 13px;
            margin: 0 0 27px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 11px;
            border: 1px solid var(--border);
            background: var(--input);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border .2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        input::placeholder {
            color: var(--muted);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        .show-password {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 17px;
        }

        .create-button {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: none;
            border-radius: 11px;
            background: var(--primary);
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s, transform .2s;
        }

        .create-button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .login-text {
            text-align: center;
            margin-top: 23px;
            color: var(--muted);
            font-size: 13px;
        }

        .login-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        @media (max-width: 800px) {
            main {
                grid-template-columns: 1fr;
                max-width: 500px;
                gap: 30px;
                margin: 40px auto;
            }

            .intro h1 {
                font-size: 35px;
            }
        }

        @media (max-width: 500px) {
            nav {
                padding: 0 5%;
            }

            .register-card {
                padding: 23px;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="/" class="logo">Code<span>Sphere</span></a>
    <button class="theme-button" id="themeButton" onclick="toggleTheme()" aria-label="Cambiar tema">🌙</button>
</nav>

<main>
    <section class="intro">
        <small>Un nuevo comienzo</small>
        <h1>Tu espacio en <span>CodeSphere.</span></h1>
        <p>
            Creá tu cuenta y empezá a compartir ideas,
            conocer personas y formar parte de nuestra comunidad.
        </p>
    </section>

    <section class="register-card">
        <h2>Crear cuenta</h2>
        <p class="subtitle">Completá tus datos para comenzar.</p>

        <form method="POST">
            {% csrf_token %}

            <div class="field">
                <label for="username">Nombre de usuario</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Elegí un usuario"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Contraseña</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Creá una contraseña"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                        aria-label="Mostrar contraseña"
                    >👁</button>
                </div>
            </div>

            <button type="submit" class="create-button">
                Crear mi cuenta ↗
            </button>
        </form>

        <div class="login-text">
            ¿Ya tenés cuenta?
            <a href="/login/">Iniciá sesión</a>
        </div>
    </section>
</main>

<script>
    const themeButton = document.getElementById("themeButton");

    function applyTheme(theme) {
        document.body.classList.toggle("dark", theme === "dark");
        themeButton.textContent = theme === "dark" ? "☀️" : "🌙";
    }

    function toggleTheme() {
        const newTheme = document.body.classList.contains("dark")
            ? "light"
            : "dark";

        localStorage.setItem("codesphere-theme", newTheme);
        applyTheme(newTheme);
    }

    function togglePassword() {
        const password = document.getElementById("password");

        password.type = password.type === "password"
            ? "text"
            : "password";
    }

    applyTheme(localStorage.getItem("codesphere-theme") || "light");
</script>

</body>
</html>
