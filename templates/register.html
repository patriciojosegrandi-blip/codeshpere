<!DOCTYPE html>
<html>
<head>
    <title>Registro</title>
</head>
<body>

<h2>Crear cuenta</h2>

<form method="POST">
    {% csrf_token %}

    <input type="text"
           name="username"
           placeholder="Usuario"
           required>

    <br><br>

    <input type="password"
           name="password"
           placeholder="Contraseña"
           required>

    <br><br>

    <button type="submit">
        Crear cuenta
    </button>
</form>

<br>

<a href="/login/">Ya tengo cuenta</a>

</body>
</html>
