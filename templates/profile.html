<!DOCTYPE html>
<html>
<head>
    <title>Mi Perfil</title>

    <style>
        body{
            background:#f3f4f6;
            font-family:Arial,sans-serif;
        }

        .card{
            width:600px;
            margin:40px auto;
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
        }

        .avatar{
            width:150px;
            height:150px;
            border-radius:50%;
            object-fit:cover;
            display:block;
            margin:auto;
        }

        textarea{
            width:100%;
            height:120px;
            padding:10px;
            margin-top:10px;
        }

        button{
            margin-top:10px;
            background:#2563eb;
            color:white;
            border:none;
            padding:10px 15px;
            border-radius:8px;
            cursor:pointer;
        }

        .logout{
            display:inline-block;
            margin-top:15px;
            text-decoration:none;
        }
    </style>
</head>
<body>

<div class="card">

    {% if profile.avatar %}
        <img src="{{ profile.avatar.url }}" class="avatar">
    {% endif %}

    <h2>@{{ request.user.username }}</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <input type="file" name="avatar">

        <br><br>

        <textarea name="bio">{{ profile.bio }}</textarea>

        <br>

        <button type="submit">
            Guardar perfil
        </button>
    </form>

    <br>

    <a href="/" class="logout">⬅ Volver al inicio</a>
    <br>
    <a href="/logout/" class="logout">Cerrar sesión</a>

</div>

</body>
</html>
