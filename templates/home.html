<!DOCTYPE html>

<html>
<head>
    <title>CodeSphere</title>

<style>
    body {
        background: #f3f4f6;
        font-family: Arial, sans-serif;
        margin: 0;
    }

    .navbar {
        background: white;
        padding: 15px;
        box-shadow: 0 2px 10px rgba(0,0,0,.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
    }

    .btn {
        background: #2563eb;
        color: white;
        text-decoration: none;
        padding: 10px 15px;
        border-radius: 8px;
        margin-left: 5px;
    }

    .feed {
        width: 700px;
        margin: 20px auto;
    }

    .post {
        background: white;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 12px;
        box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .user-row {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
    }

    .avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        object-fit: cover;
        margin-right: 10px;
    }

    .username a {
        color: black;
        text-decoration: none;
        font-weight: bold;
    }

    .username a:hover {
        text-decoration: underline;
    }

    .post-image {
        width: 100%;
        max-height: 600px;
        object-fit: cover;
        border-radius: 12px;
        margin-top: 10px;
    }

    .date {
        color: gray;
        font-size: 12px;
        margin-top: 10px;
    }
</style>

</head>
<body>

<div class="navbar">

<div class="logo">
    🚀 CodeSphere
</div>

<div>
    <a href="/create/" class="btn">➕ Publicar</a>
    <a href="/profile/" class="btn">👤 Mi Perfil</a>
</div>

</div>

<div class="feed">

{% for post in posts %}

<div class="post">

```
<div class="user-row">

    {% if post.user.profile.avatar %}
        <img
            src="{{ post.user.profile.avatar.url }}"
            class="avatar"
        >
    {% endif %}

    <div class="username">
        <a href="/user/{{ post.user.username }}/">
            @{{ post.user.username }}
        </a>
    </div>

</div>

<div>
    {{ post.content }}
</div>

{% if post.image %}
    <img
        src="{{ post.image.url }}"
        class="post-image"
    >
{% endif %}

<div class="date">
    {{ post.created_at }}
</div>
```

</div>

{% empty %}

<div class="post">
    Todavía no hay publicaciones.
</div>

{% endfor %}

</div>

</body>
</html>
