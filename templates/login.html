<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h2>Iniciar sesión</h2>

<form method="POST">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Usuario">
    <br><br>
    <input type="password" name="password" placeholder="Contraseña">
    <br><br>
    <button type="submit">Entrar</button>
</form>

<br>

<a href="/register/">Crear cuenta</a>

</body>
</html>
